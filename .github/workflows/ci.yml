name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.3", "3.4", "4.0", "head"]
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7

      - name: phlex/setup
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: false
          rubygems: latest

      - name: Install dependencies
        run: bundle config set --local without development && bundle install --jobs 4

      - name: Appraisals install
        run: bundle exec appraisal install --jobs 4

      - name: Tests
        run: bundle exec appraisal bundle exec qd

  # The suite compiles components by default, so this runs it with the compiler off.
  uncompiled:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: false
          rubygems: latest

      # The test app loads bootsnap, which is in the development group.
      - name: Install dependencies
        run: bundle install --jobs 4

      - name: Tests
        env:
          PHLEX_COMPILER: "false"
        run: bundle exec qd

  rubocop:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - name: Install dependencies
        run: bundle install --jobs 4

      - name: Rubocop
        run: bundle exec rubocop
